[project]
name = "mle-refactoring-project"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.4",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "skops>=0.14.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kc_housing"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra"]
strict = true
markers = [
    "integration: crosses a file or database boundary",
    "model: trains and scores a model",
    "data: needs real processed data; skips until it exists",
    "llm: calls a real LLM or embedding API; skips without an API key (RAG / LLM projects)",
]

[tool.ruff]
# Frozen reference notebook (ADR-001) and the course reference solution are not ours to lint.
extend-exclude = ["King-County.ipynb", "bonus_solution"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["kc_housing"]
