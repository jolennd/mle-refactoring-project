name: tests
on:
  push:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -m "not integration and not model and not data and not llm"
      - if: github.event_name == 'pull_request'
        run: uv run pytest -m "not data and not llm"
